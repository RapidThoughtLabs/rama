<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rama Home</title>
<!-- Home redesign mockup. Standalone: open this file directly. Wallpaper images resolve relative to
     docs/Rama/ (../../apps/desktop/public/wallpapers); every theme has a gradient fallback if they don't. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Kanji for the theme seals only, subset to the nine theme names. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&text=%E6%B3%A2%E7%A5%9E%E5%A5%88%E5%B7%9D%E5%A2%A8%E6%A1%9C%E6%A4%BF%E6%9C%B1%E8%8B%A5%E8%91%89%E6%9D%BE%E7%B7%91%E9%9D%92&display=swap">
<style>
/* ═══ Tokens ════════════════════════════════════════════════════════════════
   A theme still supplies four colours (ground / ink / inkLoud / accent) plus a
   wallpaper — same contract as packages/ui/src/themes/*.json. JS writes those
   four onto :root; everything below is derived per mode, like tokens.css. */
:root {
  --ground: #ded6c3; --ink: #1f2a20; --ink-hi: #0e150d; --accent: #3a5241;
  --wp: none; --veil: 1; --wp-fit: cover; --wp-pos: center;
  --scale: 1;

  --f-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-read: "Literata", "Shippori Mincho", Georgia, serif;
  --f-code: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  --f-seal: "Shippori Mincho", "Hiragino Mincho ProN", serif;

  /* Type ramp — 12 / 13.5 / 15 / 17 / 21 / 28 / 44, all scaled by the Text size control */
  --fs-xs: calc(12px * var(--scale));
  --fs-sm: calc(13.5px * var(--scale));
  --fs-md: calc(15px * var(--scale));
  --fs-read: calc(17px * var(--scale));
  --fs-lg: calc(21px * var(--scale));
  --fs-xl: calc(28px * var(--scale));
  --fs-hero: calc(44px * var(--scale));

  --ink-1: var(--ink-hi);
  --ink-2: var(--ink);
  --ink-3: color-mix(in oklab, var(--ink) 70%, var(--ground));
  --ink-4: color-mix(in oklab, var(--ink) 50%, var(--ground));
  --line: color-mix(in oklab, var(--ink) 11%, transparent);
  --line-2: color-mix(in oklab, var(--ink) 19%, transparent);
  --hover: color-mix(in oklab, var(--ink) 6%, transparent);
  --selected: color-mix(in oklab, var(--accent) 15%, transparent);
  --on-accent: var(--ground);
  --ring: color-mix(in oklab, var(--accent) 55%, transparent);
}
:root[data-mode="light"] {
  color-scheme: light;
  --sidebar: color-mix(in oklab, var(--ground) 60%, #fff);
  --raised: color-mix(in oklab, var(--ground) 28%, #fff);
  --well: color-mix(in oklab, var(--ground) 90%, var(--ink));
  --bubble: color-mix(in oklab, var(--accent) 15%, var(--raised));
  --panel: color-mix(in oklab, var(--ground) 52%, #fff);
  --code-bg: color-mix(in oklab, var(--ground) 22%, #fff);
  --good: #2e7d4f; --warn: #a6791f; --bad: #b33a3a;
  --shadow-sm: 0 1px 2px color-mix(in oklab, var(--ink) 10%, transparent);
  --shadow: 0 1px 2px color-mix(in oklab, var(--ink) 6%, transparent), 0 10px 30px -14px color-mix(in oklab, var(--ink) 28%, transparent);
  --shadow-pop: 0 2px 6px color-mix(in oklab, var(--ink) 8%, transparent), 0 24px 56px -20px color-mix(in oklab, var(--ink) 40%, transparent);
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --sidebar: color-mix(in oklab, var(--ground) 84%, #000);
  --raised: color-mix(in oklab, var(--ground) 90%, var(--ink));
  --well: color-mix(in oklab, var(--ground) 76%, #000);
  --bubble: color-mix(in oklab, var(--accent) 17%, var(--ground));
  --panel: color-mix(in oklab, var(--ground) 94%, var(--ink));
  --code-bg: color-mix(in oklab, var(--ground) 82%, #000);
  --good: #8cc9a0; --warn: #e6c384; --bad: #e8808a;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.25), 0 14px 36px -16px rgb(0 0 0 / 0.7);
  --shadow-pop: 0 2px 8px rgb(0 0 0 / 0.3), 0 28px 64px -18px rgb(0 0 0 / 0.8);
}

/* ═══ Foundations ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--f-ui);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--ink-2);
  background: var(--ground);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
::selection { background: color-mix(in oklab, var(--accent) 30%, transparent); }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
[hidden] { display: none !important; }

.app { display: flex; height: 100vh; height: 100dvh; }

/* ═══ Sidebar ═══════════════════════════════════════════════════════════════ */
.sidebar {
  width: 272px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  transition: background-color .35s, margin-left .25s ease;
  z-index: 20;
}
.app[data-sb="closed"] .sidebar { margin-left: -272px; }
.sb-top { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 18px; flex-shrink: 0; }
.lights { display: flex; gap: 8px; margin-right: auto; }
.lights span { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); }
.lights span:nth-child(2) { background: #febc2e; }
.lights span:nth-child(3) { background: #28c840; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px;
  display: inline-grid; place-items: center;
  color: var(--ink-3);
  transition: background-color .15s, color .15s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink-1); }

.seg {
  display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
  margin: 4px 12px 14px; padding: 3px;
  background: var(--well); border-radius: 11px;
}
.seg button {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  height: 32px; border-radius: 8px;
  font-size: var(--fs-sm); font-weight: 500; color: var(--ink-3);
  transition: background-color .15s, color .15s;
}
.seg button:hover { color: var(--ink-1); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink-1); box-shadow: var(--shadow-sm); }

.sb-nav { padding: 0 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-row {
  display: flex; align-items: center; gap: 10px;
  height: 34px; padding: 0 10px; border-radius: 8px;
  font-size: var(--fs-md); color: var(--ink-2); text-align: left;
}
.nav-row svg { color: var(--ink-3); }
.nav-row:hover { background: var(--hover); }
.nav-row kbd { margin-left: auto; font-family: var(--f-ui); font-size: var(--fs-xs); color: var(--ink-4); }

.sb-list { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
.group-label { font-size: var(--fs-xs); font-weight: 500; color: var(--ink-4); padding: 16px 10px 5px; }
.project-label { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); padding: 16px 10px 5px; }
.project-label svg { color: var(--ink-4); }
.chat-row {
  display: block; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: 8px;
  font-size: var(--fs-sm); color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-row:hover { background: var(--hover); }
.chat-row[aria-current="true"] { background: var(--selected); color: var(--ink-1); font-weight: 500; }

.sb-foot { display: flex; align-items: center; gap: 10px; padding: 10px 10px 12px 14px; border-top: 1px solid var(--line); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex-shrink: 0; }
.avatar svg { width: 17px; height: 17px; }
.who { flex: 1; min-width: 0; line-height: 1.25; }
.who b { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-1); }
.who span { font-size: var(--fs-xs); color: var(--ink-4); }

/* ═══ Main ══════════════════════════════════════════════════════════════════ */
.main { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
.wall, .veil { position: absolute; inset: 0; pointer-events: none; }
.wall { background-image: var(--wp); background-size: var(--wp-fit); background-position: var(--wp-pos); background-repeat: no-repeat; background-color: var(--ground); }
.veil { background: var(--ground); opacity: var(--veil); transition: background-color .35s, opacity .35s; }

.topbar { position: relative; z-index: 5; height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 76px 0 14px; }
.topbar .open-sb { display: none; }
.app[data-sb="closed"] .topbar .open-sb { display: inline-grid; }
.chat-title {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  padding: 5px 8px; border-radius: 8px;
  font-size: var(--fs-md); font-weight: 500; color: var(--ink-1);
}
.chat-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-title svg { color: var(--ink-4); }
.chat-title:hover { background: var(--hover); }

/* The seal — a painter's rakkan stamped in the corner of the page. It shows
   the active theme's name in kanji and opens the theme picker. */
.seal {
  position: absolute; top: 14px; right: 22px; z-index: 6;
  writing-mode: vertical-rl; text-orientation: upright;
  font-family: var(--f-seal); font-weight: 600; font-size: 17px; line-height: 1; letter-spacing: 3px;
  padding: 8px 6px 5px; border-radius: 3px;
  background: var(--accent); color: var(--on-accent);
  outline: 1.5px solid color-mix(in oklab, var(--on-accent) 55%, transparent); outline-offset: -4px;
  transform: rotate(-2.5deg);
  box-shadow: 0 1px 0 color-mix(in oklab, var(--accent) 60%, #000);
  transition: transform .2s ease, background-color .35s, color .35s;
}
.seal:hover { transform: rotate(0deg) translateY(-1px); }
.seal:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

.view { position: relative; z-index: 1; flex: 1; min-height: 0; }

/* ═══ Landing ═══════════════════════════════════════════════════════════════ */
#landing { overflow-y: auto; }
.landing-inner { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 11vh 24px 56px; }
.greet-fluke { width: 40px; height: 34px; color: var(--accent); }
.greet {
  font-family: var(--f-read); font-weight: 400; font-size: var(--fs-hero); line-height: 1.1;
  letter-spacing: -0.015em; color: var(--ink-1);
  margin: 14px 0 30px; text-align: center; text-wrap: balance;
}
.landing-inner .composer-wrap { width: min(680px, 100%); }
.resume { width: min(680px, 100%); margin-top: 52px; }
.resume h2 { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-3); margin: 0 0 6px 14px; }
.resume-row {
  display: grid; grid-template-columns: 1fr auto; column-gap: 20px; width: 100%; text-align: left;
  padding: 11px 14px; border-radius: 12px;
  transition: background-color .15s;
}
.resume-row:hover { background: var(--hover); }
.resume-row b { font-weight: 500; font-size: var(--fs-md); color: var(--ink-1); }
.resume-row p { grid-column: 1; margin: 1px 0 0; font-size: var(--fs-sm); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resume-row time { grid-row: 1; grid-column: 2; font-size: var(--fs-xs); color: var(--ink-4); font-variant-numeric: tabular-nums; align-self: center; }

/* The one orchestrated moment: fluke, greeting, composer arrive in sequence. */
.arrive .greet-fluke { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.arrive .greet { animation: rise .7s .08s cubic-bezier(.2,.7,.2,1) both; }
.arrive .composer-wrap { animation: rise .7s .16s cubic-bezier(.2,.7,.2,1) both; }
.arrive .resume { animation: fade .8s .3s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ═══ Composer ══════════════════════════════════════════════════════════════ */
.composer {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 14px 12px 10px 18px;
  transition: border-color .15s, box-shadow .15s, background-color .35s;
}
.composer:focus-within { border-color: color-mix(in oklab, var(--accent) 45%, transparent); box-shadow: var(--shadow), 0 0 0 4px color-mix(in oklab, var(--accent) 12%, transparent); }
.composer textarea {
  display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent;
  font-family: var(--f-ui); font-size: calc(16px * var(--scale)); line-height: 1.5; color: var(--ink-1);
  min-height: 26px; max-height: 220px; padding: 0 6px 0 0;
}
.composer textarea::placeholder { color: var(--ink-4); }
.composer-row { display: flex; align-items: center; gap: 2px; margin-top: 12px; margin-left: -8px; }
.tool-btn {
  height: 32px; min-width: 32px; padding: 0 8px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-sm); color: var(--ink-3);
  transition: background-color .15s, color .15s;
}
.tool-btn:hover { background: var(--hover); color: var(--ink-1); }
.tool-btn[aria-pressed="true"] { background: var(--selected); color: var(--accent); }
.tool-btn .lbl { display: none; }
.tool-btn[aria-pressed="true"] .lbl { display: inline; }
.model-pill {
  margin-left: auto; height: 32px; padding: 0 10px 0 11px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2);
  transition: background-color .15s;
}
.model-pill:hover { background: var(--hover); }
.model-pill .where { color: var(--ink-4); }
.model-pill svg.chev { color: var(--ink-4); width: 14px; height: 14px; }
.send {
  width: 34px; height: 34px; border-radius: 50%; margin-left: 4px;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
  transition: background-color .15s, transform .1s, opacity .15s;
}
.send:active { transform: scale(.94); }
.send:disabled { background: var(--line-2); color: var(--ink-4); cursor: default; }
.send svg { stroke-width: 1.9; }
.privacy { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 0; font-size: var(--fs-xs); color: var(--ink-4); text-align: center; }
.privacy svg { width: 13px; height: 13px; }
.pv-note svg { vertical-align: -2px; margin-right: 6px; }
.model-pill span { white-space: nowrap; }

/* ═══ Conversation ══════════════════════════════════════════════════════════ */
#chat { display: flex; flex-direction: column; }
.scroller { flex: 1; min-height: 0; overflow-y: auto; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to bottom, transparent, #000 18px, #000 calc(100% - 28px), transparent); }
.transcript { width: min(720px, 100%); margin: 0 auto; padding: 40px 24px 40px; display: flex; flex-direction: column; gap: 30px; }
.dock { width: min(720px, 100%); margin: 0 auto; padding: 0 24px 16px; flex-shrink: 0; }

.turn-user { align-self: flex-end; max-width: min(82%, 580px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.bubble {
  background: var(--bubble); color: var(--ink-1);
  padding: 10px 16px; border-radius: 18px 18px 6px 18px;
  font-size: calc(15.5px * var(--scale)); line-height: 1.55;
  transition: background-color .35s;
}
.attach {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px 7px 7px; border-radius: 12px;
  background: var(--raised); border: 1px solid var(--line);
}
.attach-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--selected); color: var(--accent); display: grid; place-items: center; }
.attach b { display: block; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-1); line-height: 1.3; }
.attach small { font-size: var(--fs-xs); color: var(--ink-4); }

.turn-ai { display: flex; flex-direction: column; }
.acts { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin: -4px 0 12px -6px; }
.act-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 8px 4px 5px; border-radius: 8px;
  font-size: var(--fs-sm); color: var(--ink-3);
}
.act-btn:hover { background: var(--hover); color: var(--ink-1); }
.act-btn .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--well); display: grid; place-items: center; color: var(--ink-3); }
.act-btn .dot svg { width: 13px; height: 13px; }
.act-btn .meta { color: var(--ink-4); }
.act-btn svg.chev { width: 13px; height: 13px; color: var(--ink-4); transition: transform .2s; }
.act-btn[aria-expanded="true"] svg.chev { transform: rotate(90deg); }
.act-body { margin: 4px 0 8px 16px; padding: 2px 0 2px 18px; border-left: 1.5px solid var(--line-2); font-size: var(--fs-sm); color: var(--ink-3); max-width: 60ch; }
.act-body ol { margin: 0; padding-left: 1.2em; }
.act-body li { margin: 3px 0; }
.act-body li span { color: var(--ink-4); }

.prose { font-family: var(--f-read); font-size: var(--fs-read); line-height: 1.65; color: var(--ink-2); max-width: 66ch; }
:root[data-reading="sans"] .prose { font-family: var(--f-ui); font-size: calc(16px * var(--scale)); line-height: 1.6; }
.prose > :first-child { margin-top: 0; }
.prose p { margin: 0 0 .8em; }
.prose strong { font-weight: 600; color: var(--ink-1); }
.prose em { font-style: italic; }
.prose ul { margin: .2em 0 .9em; padding-left: 1.25em; }
.prose li { margin: .4em 0; padding-left: .2em; }
.prose li::marker { color: var(--accent); }
.prose code { font-family: var(--f-code); font-size: .82em; background: var(--well); padding: .12em .4em; border-radius: 5px; color: var(--ink-1); }
.prose table { width: 100%; border-collapse: collapse; margin: .4em 0 1.1em; font-family: var(--f-ui); font-size: var(--fs-sm); line-height: 1.45; }
.prose th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 0 14px 8px 0; border-bottom: 1px solid var(--line-2); }
.prose td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.prose td.num, .prose th.num { text-align: right; font-variant-numeric: tabular-nums; }
.prose tr:last-child td { border-bottom: 0; }

.card { margin: .3em 0 1em; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px 7px 16px; border-bottom: 1px solid var(--line); font-family: var(--f-ui); font-size: var(--fs-xs); font-weight: 500; color: var(--ink-3); }
.mini { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; font-family: var(--f-ui); font-size: var(--fs-xs); color: var(--ink-3); }
.mini:hover { background: var(--hover); color: var(--ink-1); }
.mini svg { width: 13px; height: 13px; }
.draft-body { padding: 14px 18px 4px; font-size: .94em; }
.draft-body p { margin: 0 0 .7em; }
.draft-body .subj { font-family: var(--f-ui); font-size: var(--fs-sm); color: var(--ink-3); }
.draft-body .subj b { color: var(--ink-1); font-weight: 500; }
.code-card { background: var(--well); border-color: transparent; }
.code-card .card-head { border-color: var(--line); }
.code-card pre { margin: 0; padding: 14px 16px 16px; overflow-x: auto; font-family: var(--f-code); font-size: calc(13.5px * var(--scale)); line-height: 1.6; color: var(--ink-1); }
.tok-fn { color: var(--accent); font-weight: 500; }
.tok-ref { color: var(--ink-3); }

.turn-actions { display: flex; align-items: center; gap: 2px; margin: 2px 0 0 -7px; opacity: 0; transition: opacity .15s; }
.turn-ai:hover .turn-actions, .turn-ai:last-child .turn-actions, .turn-actions:focus-within { opacity: 1; }
.turn-actions .icon-btn { width: 28px; height: 28px; color: var(--ink-4); }
.turn-actions .icon-btn:hover { color: var(--ink-1); }
.turn-actions .by { margin-left: 8px; font-size: var(--fs-xs); color: var(--ink-4); }

.working { display: inline-flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--ink-3); }
.working svg { width: 22px; height: 19px; color: var(--accent); animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(1px) rotate(-4deg); } 50% { transform: translateY(-2px) rotate(4deg); } }

/* ═══ Buttons ═══════════════════════════════════════════════════════════════ */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-family: var(--f-ui); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.btn:hover { background: color-mix(in oklab, var(--accent) 88%, var(--ink-1)); }
.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-ghost:hover { background: var(--hover); color: var(--ink-1); }
.btn-soft { background: var(--selected); color: var(--accent); }
.btn-soft:hover { background: color-mix(in oklab, var(--accent) 22%, transparent); }
.btn svg { width: 14px; height: 14px; }

/* ═══ Code tab ══════════════════════════════════════════════════════════════
   Same type, composer and tool rows as Home. The terminal look survives only
   where it's genuinely a terminal: code, diffs and shell output. */
#code { display: flex; flex-direction: column; }
.code-body { flex: 1; min-height: 0; display: flex; position: relative; }
.code-chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.code-chat > .scroller { flex: 1; }
#codeLanding { flex: 1; overflow-y: auto; }
.code-chat .transcript, .code-chat .dock { width: min(700px, 100%); }

.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; margin-left: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 500; color: var(--ink-3); white-space: nowrap;
  box-shadow: inset 0 0 0 1px var(--line);
}
.chip svg { width: 13px; height: 13px; color: var(--ink-4); }
button.chip:hover { background: var(--hover); color: var(--ink-1); }
.chip[aria-pressed="true"] { background: var(--selected); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent); }
.chip[aria-pressed="true"] svg { color: var(--accent); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.cmd-btn { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; font-size: var(--fs-sm); color: var(--ink-3); }
.cmd-btn:hover { background: var(--hover); color: var(--ink-1); }
.cmd-btn kbd { font-family: var(--f-ui); font-size: var(--fs-xs); color: var(--ink-4); padding: 1px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-2); }
.icon-btn[aria-pressed="true"] { color: var(--accent); background: var(--selected); }

/* Composer extras in Code: the context chips and the mode pill */
.ctx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -4px 0 12px -6px; }
.mode-pill { margin-left: auto; }
.mode-pill + .model-pill { margin-left: 0; }
.ring { width: 14px; height: 14px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 2.4; }
.ring .bg { stroke: var(--line-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; }

/* Transcript blocks that only Code needs */
.turn-ai > .acts + .prose, .turn-ai > .prose + .acts, .turn-ai > .card + .acts, .turn-ai > .plan + .acts, .turn-ai > .ask + .acts { margin-top: 6px; }
.turn-ai > .prose { margin-bottom: 4px; }
.acts .act-btn b { font-weight: 500; color: var(--ink-2); }
.plus { color: var(--good); font-variant-numeric: tabular-nums; }
.minus { color: var(--bad); font-variant-numeric: tabular-nums; }
.ok { color: var(--good); }
.fail { color: var(--bad); }
.act-body .card { margin: 6px 0 4px; max-width: 100%; }
.act-body .link { display: inline-flex; align-items: center; gap: 5px; margin: 4px 0 2px; font-size: var(--fs-xs); font-weight: 500; color: var(--accent); }
.act-body .link:hover { text-decoration: underline; }
.act-body .link svg { width: 12px; height: 12px; }
.act-body .files { list-style: none; margin: 0; padding: 0; }
.act-body .files li { display: flex; align-items: baseline; gap: 8px; margin: 4px 0; }
.act-body .files li > span:first-child { color: var(--ink-4); min-width: 66px; }

.path {
  display: inline-flex; align-items: baseline; gap: 4px;
  font-family: var(--f-code); font-size: .8em; line-height: 1.3;
  padding: .1em .45em; border-radius: 6px; background: var(--well); color: var(--ink-1);
  cursor: pointer; vertical-align: baseline;
}
.path:hover { background: var(--selected); color: var(--accent); }

.plan { margin: .4em 0 1em; padding: 14px 16px 10px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); font-family: var(--f-ui); max-width: 66ch; }
.plan-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: var(--fs-sm); color: var(--ink-3); }
.plan-head b { font-weight: 600; color: var(--ink-1); }
.plan-bar { height: 4px; border-radius: 2px; background: var(--well); margin: 10px 0 6px; overflow: hidden; }
.plan-bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.plan ul { list-style: none; margin: 0; padding: 0; }
.plan li { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; font-size: var(--fs-md); color: var(--ink-2); line-height: 1.4; }
.tick-circle { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.tick-circle svg { width: 11px; height: 11px; stroke-width: 2.2; }
.plan li.done .tick-circle { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.plan li.done > span:last-child { color: var(--ink-3); }

.changes-card .card-head b { color: var(--ink-1); font-weight: 600; font-size: var(--fs-sm); }
.cf-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 16px; font-family: var(--f-ui); font-size: var(--fs-sm); border-bottom: 1px solid var(--line); }
.cf-row:hover { background: var(--hover); }
.cf-row svg { color: var(--ink-4); width: 15px; height: 15px; }
.cf-row .nm { color: var(--ink-1); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-row .nm small { font-weight: 400; color: var(--ink-4); margin-left: 6px; font-size: var(--fs-xs); }
.cf-row .delta { font-size: var(--fs-xs); display: flex; gap: 6px; }
.card-foot { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; }

.ask {
  margin: .4em 0 .6em; padding: 16px 18px 14px; border-radius: 14px; max-width: 66ch;
  background: color-mix(in oklab, var(--warn) 8%, var(--raised));
  border: 1px solid color-mix(in oklab, var(--warn) 38%, transparent);
  font-family: var(--f-ui);
}
.ask h4 { margin: 0 0 8px; font-size: var(--fs-md); font-weight: 600; color: var(--ink-1); display: flex; align-items: center; gap: 8px; }
.ask h4 svg { color: var(--warn); }
.ask p { margin: 8px 0 14px; font-size: var(--fs-sm); color: var(--ink-3); line-height: 1.5; }
.ask code { font-family: var(--f-code); font-size: calc(12.5px * var(--scale)); padding: 4px 9px; border-radius: 7px; background: var(--well); color: var(--ink-1); display: inline-block; }
.ask .row { display: flex; flex-wrap: wrap; gap: 8px; }

.notice { align-self: center; font-size: var(--fs-xs); color: var(--ink-4); padding: 0 12px; text-align: center; }

/* Diffs, files and terminal output — the only monospace surfaces */
.diff, .codeview, .term { font-family: var(--f-code); font-size: calc(12.5px * var(--scale)); line-height: 1.7; color: var(--ink-1); }
.hunk { font-family: var(--f-ui); font-size: var(--fs-xs); color: var(--ink-4); padding: 10px 16px 6px; }
.diff, .codeview { width: max-content; min-width: 100%; }
.dl { display: grid; grid-template-columns: 38px 38px 16px auto; white-space: pre; padding-right: 20px; }
.dl .n { color: var(--ink-4); text-align: right; padding-right: 8px; user-select: none; opacity: .8; }
.dl .s { color: var(--ink-4); user-select: none; }
.dl.add { background: color-mix(in oklab, var(--good) 13%, transparent); }
.dl.add .s { color: var(--good); }
.dl.del { background: color-mix(in oklab, var(--bad) 11%, transparent); }
.dl.del .s { color: var(--bad); }
.code-card:has(.diff) { max-height: 300px; overflow: auto; }
.card .diff { padding-bottom: 8px; background: var(--code-bg); }
.cl { display: grid; grid-template-columns: 46px auto; white-space: pre; padding-right: 20px; }
.cl .n { color: var(--ink-4); text-align: right; padding-right: 16px; user-select: none; opacity: .75; }
.cl.hl { background: var(--selected); }
.t-k { color: var(--accent); }
.t-s { color: color-mix(in oklab, var(--good) 75%, var(--ink-1)); }
.t-c { color: var(--ink-4); font-style: italic; }
.t-n { color: var(--warn); }
.term { padding: 14px 18px 20px; white-space: pre-wrap; word-break: break-word; }
.term .p { color: var(--accent); }
.term .m { color: var(--ink-4); }
.term .g { color: var(--good); }
.card .term { max-height: 260px; overflow: auto; background: var(--code-bg); padding: 12px 16px; }
.caret-blink { display: inline-block; width: .55em; height: 1.1em; vertical-align: -0.2em; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.chat-row { display: flex; align-items: center; gap: 8px; }
.chat-row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flag { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in oklab, var(--warn) 25%, transparent); }
.project-label .add { margin-left: auto; width: 24px; height: 24px; opacity: 0; }
.project-label .add svg { width: 14px; height: 14px; }
.project-label:hover .add, .project-label .add:focus-visible { opacity: 1; }
.privacy { flex-wrap: wrap; }
.privacy .ctx { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; }
.only-collapsed { display: none !important; }
.ws[data-rail="collapsed"] .only-collapsed { display: grid !important; }
.tree-row span { overflow: hidden; text-overflow: ellipsis; }

/* ═══ Workspace (Mission Control) ═══════════════════════════════════════════
   A panel of paper beside the conversation, not a second terminal. One band
   rule from MISSION_CONTROL_PLAN §4.1 survives: stage toolbar and rail
   header share one row and one bottom border. */
.splitter { width: 12px; flex-shrink: 0; cursor: col-resize; position: relative; z-index: 3; touch-action: none; }
.splitter::after { content: ""; position: absolute; top: 40%; bottom: 40%; left: 4px; width: 4px; border-radius: 2px; background: var(--line-2); opacity: 0; transition: opacity .15s, background-color .15s; }
.code-body:hover .splitter::after { opacity: 1; }
.splitter:hover::after, .splitter.drag::after { background: var(--accent); opacity: 1; }
.ws {
  width: var(--ws-w, 48%); min-width: 360px; flex-shrink: 0;
  margin: 0 12px 12px 0; border-radius: 16px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
  display: grid; grid-template-columns: minmax(0, 1fr) var(--rail-w, 212px); grid-template-rows: 50px 42px minmax(0, 1fr);
  transition: background-color .35s;
}
.code-body[data-ws="closed"] .ws, .code-body[data-ws="closed"] .splitter { display: none; }
.ws[data-rail="collapsed"] { --rail-w: 48px; }
.ws-tabs { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 64px 0 8px; border-bottom: 1px solid var(--line); min-width: 0; }
.ws-tab {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: 9px;
  font-size: var(--fs-sm); font-weight: 500; color: var(--ink-3); white-space: nowrap;
}
.ws-tab:hover { background: var(--hover); color: var(--ink-1); }
.ws-tab[aria-selected="true"] { background: var(--well); color: var(--ink-1); }
.ws-tab .badge { font-size: var(--fs-xs); font-weight: 600; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--selected); color: var(--accent); }
.ws-tab .live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in oklab, var(--good) 22%, transparent); }
.ws-tabs .spacer { flex: 1; }
.stage-bar, .rail-head { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); min-width: 0; font-size: var(--fs-sm); }
.stage-bar { padding: 0 8px 0 14px; }
.rail-head { padding: 0 6px 0 14px; border-left: 1px solid var(--line); color: var(--ink-3); }
.rail-head b { font-weight: 600; color: var(--ink-1); }
.rail-head .grow, .stage-bar .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws[data-rail="collapsed"] .rail-head { padding: 0; justify-content: center; }
.ws[data-rail="collapsed"] .rail-head > :not(.rail-toggle) { display: none; }
.stage { overflow: auto; background: var(--code-bg); min-width: 0; }
.rail { overflow-y: auto; border-left: 1px solid var(--line); padding: 6px; }
.stage-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.stage-title b { font-weight: 500; color: var(--ink-1); white-space: nowrap; flex-shrink: 0; }
.stage-title small { color: var(--ink-4); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stage-bar .delta-inline { font-size: var(--fs-xs); white-space: nowrap; margin-right: 6px; }
.stage-bar .icon-btn { width: 28px; height: 28px; }
.stage-bar .icon-btn svg, .rail-head .icon-btn svg { width: 15px; height: 15px; }
.rail-head .icon-btn { width: 28px; height: 28px; }

.rrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; column-gap: 9px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; font-size: var(--fs-sm); color: var(--ink-2); }
.rrow:hover { background: var(--hover); }
.rrow[aria-current="true"] { background: var(--selected); color: var(--ink-1); }
.rrow svg { width: 15px; height: 15px; color: var(--ink-4); }
.rrow .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .sub { grid-column: 2 / -1; font-size: var(--fs-xs); color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .end { font-size: var(--fs-xs); color: var(--ink-4); }
.rdir { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 8px 4px; font-size: var(--fs-xs); font-weight: 500; color: var(--ink-4); text-align: left; }
.rdir span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.sdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; justify-self: center; }
.sdot.run { background: var(--good); box-shadow: 0 0 0 3px color-mix(in oklab, var(--good) 22%, transparent); }
.sdot.idle { box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.sdot.done { background: var(--ink-4); }
.ws[data-rail="collapsed"] .rail { padding: 6px 4px; }
.ws[data-rail="collapsed"] .rrow { grid-template-columns: 1fr; justify-items: center; padding: 8px 0; }
.ws[data-rail="collapsed"] .rrow > :not(:first-child), .ws[data-rail="collapsed"] .rdir { display: none; }

.tree-row { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 4px 8px; border-radius: 7px; font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; }
.tree-row:hover { background: var(--hover); }
.tree-row[aria-current="true"] { background: var(--selected); color: var(--ink-1); font-weight: 500; }
.tree-row svg { width: 14px; height: 14px; color: var(--ink-4); flex-shrink: 0; }
.tree-row .tw { width: 12px; height: 12px; }
.tree-row .tw.open { transform: rotate(90deg); }
.tree-row.leaf { padding-left: 26px; }
.ws[data-rail="collapsed"] .tree-row { display: none; }

.ftabs { display: flex; align-items: stretch; height: 100%; margin-left: -14px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.ftab { display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; font-size: var(--fs-sm); color: var(--ink-3); white-space: nowrap; border-right: 1px solid var(--line); position: relative; }
.ftab:hover { color: var(--ink-1); background: var(--hover); }
.ftab[aria-selected="true"] { color: var(--ink-1); background: var(--code-bg); }
.ftab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--code-bg); }
.ftab.preview { font-style: italic; }
.ftab .x { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-4); }
.ftab .x:hover { background: var(--hover); color: var(--ink-1); }
.ftab .x svg { width: 11px; height: 11px; }

.urlbar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--code-bg); box-shadow: inset 0 0 0 1px var(--line); font-size: var(--fs-xs); color: var(--ink-2); }
.urlbar svg { width: 12px; height: 12px; color: var(--ink-4); }
.empty { display: grid; place-items: center; text-align: center; height: 100%; padding: 24px; font-size: var(--fs-sm); color: var(--ink-4); }
.empty b { display: block; font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); margin-bottom: 4px; }

/* The Web pane shows the page the agent opened. Here it's Rama itself, in the live theme. */
.page { margin: 18px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); height: calc(100% - 36px); min-height: 300px; display: flex; background: var(--ground); }
.page .ps { width: 26%; background: var(--sidebar); padding: 14px 10px; display: flex; flex-direction: column; gap: 7px; border-right: 1px solid var(--line); }
.page .ps i { display: block; height: 7px; border-radius: 4px; background: var(--line-2); }
.page .ps i.seg2 { height: 18px; border-radius: 6px; background: var(--well); margin-bottom: 6px; }
.page .pm { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; }
.page .pm svg { width: 22px; height: 19px; color: var(--accent); }
.page .pm b { font-family: var(--f-read); font-weight: 400; font-size: 20px; color: var(--ink-1); }
.page .pm span { width: 78%; height: 40px; border-radius: 12px; background: var(--raised); box-shadow: var(--shadow-sm); border: 1px solid var(--line); }
.page.vids { flex-direction: column; background: var(--raised); padding: 14px; gap: 12px; }
.page.vids .bar { height: 26px; border-radius: 999px; background: var(--well); width: 60%; align-self: center; }
.page.vids .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.page.vids .grid i { aspect-ratio: 16 / 10; border-radius: 9px; background: var(--well); display: block; }

/* Small and mid widths: the workspace becomes a sheet over the chat */
@media (max-width: 1100px) {
  .splitter { display: none; }
  .ws { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, calc(100% - 24px)); min-width: 0; margin: 0 12px 12px 0; z-index: 8; box-shadow: var(--shadow-pop); }
}
@media (max-width: 560px) {
  .ws { width: calc(100% - 16px); margin: 0 8px 8px 0; --rail-w: 48px; }
  .ws .rail-head > :not(.rail-toggle) { display: none; }
  .ws .rail-head { padding: 0; justify-content: center; }
  .ws .rrow { grid-template-columns: 1fr; justify-items: center; padding: 8px 0; }
  .ws .rrow > :not(:first-child), .ws .rdir, .ws .tree-row { display: none; }
  .ws-tab .lbl { display: none; }
  .cmd-btn span { display: none; }
  .crumbs { display: none; }
  .mode-pill span { display: none; }
}

/* ═══ Popovers ══════════════════════════════════════════════════════════════ */
.pop {
  position: fixed; z-index: 50;
  background: var(--raised); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow-pop);
  animation: pop .16s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }

#themePop { top: 62px; right: 18px; width: 376px; max-width: calc(100vw - 32px); padding: 18px 18px 16px; max-height: calc(100vh - 80px); overflow-y: auto; }
.pop h3 { margin: 0 0 12px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-1); }
.pop h3 + .sub { margin: -10px 0 12px; font-size: var(--fs-xs); color: var(--ink-4); }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
.swatch { text-align: left; border-radius: 12px; padding: 0; }
.swatch .pv {
  display: block; position: relative; height: 66px; border-radius: 10px; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08);
  transition: box-shadow .15s, transform .15s;
}
.swatch:hover .pv { transform: translateY(-1px); }
.swatch[aria-checked="true"] .pv { box-shadow: 0 0 0 2px var(--raised), 0 0 0 4px var(--accent); }
.pv .wp { position: absolute; inset: 0; background-size: cover; background-position: center; }
.pv .vl { position: absolute; inset: 0; }
.pv .ln { position: absolute; left: 10px; height: 4px; border-radius: 2px; opacity: .8; }
.pv .ln.a { bottom: 22px; width: 46%; }
.pv .ln.b { bottom: 14px; width: 30%; opacity: .45; }
.pv .mini-seal { position: absolute; top: 8px; right: 8px; writing-mode: vertical-rl; text-orientation: upright; font-family: var(--f-seal); font-weight: 600; font-size: 9px; line-height: 1; letter-spacing: 1px; padding: 3px 2px; border-radius: 2px; }
.swatch .nm { display: block; margin-top: 6px; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-1); line-height: 1.2; }
.swatch .md { display: block; font-size: var(--fs-xs); color: var(--ink-4); }
.pop .divider { height: 1px; background: var(--line); margin: 16px -18px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.opt > span { font-size: var(--fs-sm); color: var(--ink-2); }
.mini-seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--well); }
.mini-seg button { height: 28px; padding: 0 11px; border-radius: 7px; font-size: var(--fs-xs); font-weight: 500; color: var(--ink-3); }
.mini-seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink-1); box-shadow: var(--shadow-sm); }

#modelPop, #modePop { width: 300px; padding: 8px; }
.mp-label { font-size: var(--fs-xs); font-weight: 500; color: var(--ink-4); padding: 8px 10px 4px; }
.mp-item { display: grid; grid-template-columns: 18px 1fr 16px; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; }
.mp-item:hover { background: var(--hover); }
.mp-item svg { color: var(--ink-3); }
.mp-item b { display: block; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-1); line-height: 1.3; }
.mp-item small { font-size: var(--fs-xs); color: var(--ink-4); }
.mp-item .tick { color: var(--accent); visibility: hidden; }
.mp-item[aria-checked="true"] .tick { visibility: visible; }

/* ═══ Small screens ═════════════════════════════════════════════════════════ */
.scrim { display: none; }
@media (max-width: 820px) {
  .sidebar { position: fixed; inset: 0 auto 0 0; box-shadow: var(--shadow-pop); }
  .app[data-sb="closed"] .sidebar { margin-left: -280px; }
  .app[data-sb="open"] .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgb(0 0 0 / .25); }
  .topbar .open-sb { display: inline-grid; }
  .topbar { padding-right: 64px; }
  .seal { right: 16px; }
  .landing-inner { padding-top: 9vh; padding-left: 16px; padding-right: 16px; }
  .transcript { padding-left: 16px; padding-right: 16px; }
  .dock { padding-left: 12px; padding-right: 12px; }
  .model-pill .where { display: none; }
  .turn-user { max-width: 90%; }
}
@media (max-width: 480px) {
  :root { --fs-hero: calc(34px * var(--scale)); }
  .swatches { grid-template-columns: repeat(2, 1fr); }
  .resume-row time { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

`import { createContext, useContext, useEffect, useState, type ReactNode } from "react";
import { getTheme, seedTokens, type RamaTheme } from "./themes";

// Applies the active theme's tokens to :root and remembers them for the next cold start.
const ThemeContext = createContext<ThemeState | null>(null);

interface ThemeState {
  themeId: string;
  themes: RamaTheme[];
  setThemeId: (id: string) => void;
}

function applyTokens(tokens: Record<string, string>) {
  const root = document.documentElement;
  for (const [key, value] of Object.entries(tokens)) root.style.setProperty(key, value);
}

export function ThemeProvider({ children, themes }: { children: ReactNode; themes: RamaTheme[] }) {
  const [themeId, setThemeId] = useState(() => localStorage.getItem("rama.theme") ?? "kanagawa");

  useEffect(() => {
    const theme = getTheme(themeId);
    const tokens = seedTokens(theme);
    applyTokens(tokens);
    cacheTokens(theme.id, tokens);
  }, [themeId]);

  return <ThemeContext.Provider value={{ themeId, themes, setThemeId }}>{children}</ThemeContext.Provider>;
}

const CACHE_KEY = "rama.theme.tokens";

/** Lets main.tsx paint the saved theme before React mounts. */
function cacheTokens(id: string, tokens: Record<string, string>) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ id, tokens }));
  } catch {
    // Private mode or full storage: the first frame falls back to defaults.
  }
}

export function useTheme() {
  const ctx = useContext(ThemeContext);
  if (!ctx) throw new Error("useTheme must be used inside ThemeProvider");
  return ctx;
}` },

`// Display order within the gallery: three rows of three, family as the row axis.
const DISPLAY_ORDER = ["nami", "kanagawa", "sumi", "sakura", "tsubaki", "shu", "wakaba", "matsu", "rokusho"];

export function getTheme(id: string): RamaTheme {
  return BUILTIN_THEMES.find((t) => t.id === id) ?? BUILTIN_THEMES[0];
}

export function mergeThemes(builtin: RamaTheme[], user: RamaTheme[]): RamaTheme[] {
  // A user theme file changed, so a cached copy of it may be stale.
  clearCachedTokens();
  return [...builtin.filter((b) => !user.some((u) => u.id === b.id)), ...user];
}

export function clearCachedTokens() {
  try { localStorage.removeItem("rama.theme.tokens"); } catch {}
}` },

def pixelate(path, size=12):
    """Return a pixelated copy of the image at path."""
    img = Image.open(path)
    w, h = img.size
    out = img.copy()
    for x in range(0, w, size):
        for y in range(0, h, size):
            colour = img.getpixel((x, y))
            for dx in range(size):
                for dy in range(size):
                    if x + dx < w and y + dy < h:
                        out.putpixel((x + dx, y + dy), colour)
    return out


if __name__ == "__main__":

function wpValue(t) {

function applyTheme(id) {

  r.style.setProperty("--ground", t.ground);
  r.style.setProperty("--ink", t.ink);
  r.style.setProperty("--ink-hi", t.inkLoud);
  r.style.setProperty("--accent", t.accent);
  r.style.setProperty("--wp", wpValue(t));
  r.style.setProperty("--veil", String(t.veil));
  r.style.setProperty("--wp-fit", t.fit || "cover");
  r.style.setProperty("--wp-pos", t.pos || "center");
  for (const k of ["good", "warn", "bad"]) {

/* ═══ Syntax colouring — just enough to read: keywords, strings, comments, numbers ═══ */
const langOf = (p) => p.endsWith(".py") ? "py" : p.endsWith(".md") || p.endsWith(".txt") ? "md" : "ts";
function hl(line, lang) {
  if (lang === "md") return line.startsWith("#") ? `<span class="t-k">${esc(line)}</span>` : esc(line);
  const re = lang === "py"
    ? /(#.*$)|("""[^"]*"""|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|return|import|from|for|in|if|else|with|as|class|and|None|True|False)\b|\b(\d+(?:\.\d+)?)\b/g
    : /(\/\/.*$|\/\*.*?\*\/|\/\*\*.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(import|from|export|function|const|let|return|if|for|of|try|catch|type|interface|new|await|async|default|throw)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    out += `<span class="${m[1] ? "t-c" : m[2] ? "t-s" : m[3] ? "t-k" : "t-n"}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
    if (!m[0].length) re.lastIndex++;
  }
  return out + esc(line.slice(last));
}
function diffHTML(path) {
  const d = DIFFS[path];
  return `<div class="diff">${d.hunks.map((h) => {
    let o = h.old, n = h.nu;
    const rows = h.body.split("\n").map((raw) => {
      const sign = raw[0] || " ", code = raw.slice(1);
      let cls = "", on = "", nn = "";
      if (sign === "+") { cls = "add"; nn = n++; }
      else if (sign === "-") { cls = "del"; on = o++; }
      else { on = o++; nn = n++; }
      return `<div class="dl ${cls}"><span class="n">${on}</span><span class="n">${nn}</span><span class="s">${sign === "+" ? "+" : sign === "-" ? "−" : ""}</span><span>${hl(code, langOf(path)) || " "}</span></div>`;
    }).join("");
    return `<div class="hunk">${h.title}</div>${rows}`;
  }).join("")}</div>`;
}
function codeHTML(path) {
  const f = SRC[path];
  return `<div class="codeview" style="padding:12px 0 28px">${f.text.split("\n").map((l, i) =>
    `<div class="cl"><span class="n">${f.start + i}</span><span>${hl(l, langOf(path)) || " "}</span></div>`).join("")}</div>`;
}
const delta = (d) => `<span class="plus">+${d.add}</span>${d.del ? ` <span class="minus">−${d.del}</span>` : ""}`;

/* ═══ Code transcript ═══ */
function rowFor(b) {
  switch (b.k) {
    case "think": return actRow({ icon: "clock", label: b.label, body: `<p style="margin:0">${b.body}</p>` });
    case "explore": return actRow({ icon: "search", label: b.label, meta: b.meta, body: `<ul class="files">${b.items.map(([verb, what]) => `<li><span>${verb}</span><span>${what}</span></li>`).join("")}</ul>` });
    case "edit": {
      const d = DIFFS[b.path];
      return actRow({ icon: d.isNew ? "file-plus" : "pencil", label: `${d.isNew ? "Created" : "Edited"} <b>${base(b.path)}</b>`, meta: delta(d),
        body: `<div class="card code-card">${diffHTML(b.path)}</div><button class="link" data-goto="changes:${b.path}">Open in Changes${icon("right")}</button>` });
    }
    case "run": return actRow({ icon: "term", label: b.label, meta: b.meta, body: `<div class="card code-card"><div class="term">${b.out}</div></div><button class="link" data-goto="${b.goto}">Open in Terminal${icon("right")}</button>` });
    case "commit": return actRow({ icon: "commit", label: "Committed to <b>main</b>", meta: "4c1e9a2", body: `<div class="card code-card"><div class="term">${TERM.commit}</div></div>` });
    case "web": return actRow({ icon: "globe", label: b.label, meta: b.meta, body: `<p style="margin:0 0 4px">${b.body}</p><button class="link" data-goto="${b.goto}">Open in Web${icon("right")}</button>` });
    case "review": return actRow({ icon: "eye", label: b.label, meta: b.meta, body: `<p style="margin:0">${b.body}</p>` });
  }
  return null;
}
function planHTML(items) {
  const done = items.filter((i) => i[0]).length;
  return `<div class="plan"><div class="plan-head"><b>Plan</b><span>${done} of ${items.length} done</span></div>
    <div class="plan-bar"><i style="width:${(done / items.length) * 100}%"></i></div>
    <ul>${items.map(([d, t]) => `<li class="${d ? "done" : ""}"><span class="tick-circle">${d ? icon("check") : ""}</span><span>${t}</span></li>`).join("")}</ul></div>`;
}
function changesCardHTML() {
  const add = CHANGE_ORDER.reduce((s, p) => s + DIFFS[p].add, 0), del = CHANGE_ORDER.reduce((s, p) => s + DIFFS[p].del, 0);
  return `<div class="card changes-card">
    <div class="card-head"><b>Changed ${CHANGE_ORDER.length} files</b><span>${delta({ add, del })}</span></div>
    ${CHANGE_ORDER.map((p) => `<button class="cf-row" data-goto="changes:${p}">${icon(DIFFS[p].isNew ? "file-plus" : "pencil")}<span class="nm">${base(p)}<small>${dirOf(p)}</small></span><span class="delta">${delta(DIFFS[p])}</span></button>`).join("")}
    <div class="card-foot"><button class="btn btn-soft" data-goto="changes:">${icon("changes")}Review in Changes</button><button class="btn btn-ghost">${icon("undo")}Undo these changes</button></div>
  </div>`;
}
const askHTML = () => `<div class="ask" role="group" aria-label="Permission request">
    <h4>${icon("shield")}Commit these changes to main?</h4>
    <code>git commit -m "Apply the saved theme before first paint"</code>
    <p>This records the 4 changed files on your local <b>main</b> branch. Nothing leaves this Mac until you push.</p>
    <div class="row"><button class="btn" data-allow="once">Allow once</button><button class="btn btn-ghost" data-allow="always">Always allow in this chat</button><button class="btn btn-ghost" data-allow="deny">Deny</button></div>
  </div>`;
function codeTurnHTML(t, chat) {
  if (t.role === "user") return turnHTML(t, chat);
  if (t.pending) return workingHTML(t.pending);
  let html = "", group = [];
  const flush = () => { if (group.length) { html += `<div class="acts">${group.join("")}</div>`; group = []; } };
  for (const b of t.blocks) {
    const row = rowFor(b);
    if (row) { group.push(row); continue; }
    flush();
    if (b.k === "prose") html += `<div class="prose">${b.html}</div>`;
    else if (b.k === "plan") html += planHTML(b.items);
    else if (b.k === "changes") html += changesCardHTML();
    else if (b.k === "ask") html += askHTML();
  }
  flush();
  const waiting = t.blocks.some((b) => b.k === "ask");
  return `<div class="turn-ai">${html}${waiting ? "" : turnActions(MODELS[t.model || chat.model])}</div>`;
}
function renderCodeTranscript(scrollTo = "top") {
  const chat = codeChat();
  if (!chat) return;
  $("#codeTranscript").innerHTML = chat.turns.map((t) => codeTurnHTML(t, chat)).join("");
  $("#chatTitleText").textContent = chat.title;
  const sc = $("#codeScroller");
  sc.scrollTop = scrollTo === "bottom" ? sc.scrollHeight : 0;
}

/* ═══ Workspace ═══ */
const PANES = [
  { id: "changes", label: "Changes", icon: "changes" },
  { id: "terminal", label: "Terminal", icon: "term" },
  { id: "web", label: "Web", icon: "globe" },
  { id: "files", label: "Files", icon: "folder" },
];
function renderWS() {
  const w = WS[state.project];

  $("#wsTabs").innerHTML = PANES.map((p) => `<button class="ws-tab" role="tab" data-pane="${p.id}" aria-selected="${w.pane === p.id}" title="${p.label}">${icon(p.icon)}<span class="lbl">${p.label}</span>${

  const railToggle = `<button class="icon-btn rail-toggle" data-rail-toggle title="${$("#ws").dataset.rail === "collapsed" ? "Expand list" : "Collapse list"}" aria-label="Toggle list">${icon("panel-r")}</button>`;
  let bar = "", head = "", stage = "", rail = "";

  if (w.pane === "changes") {
    head = `${icon("branch")}<b>${proj.branch}</b><span class="grow">${w.committed ? (w.clean ? "Up to date" : "1 to push") : `${changed.length} files`}</span><button class="icon-btn" title="Refresh" aria-label="Refresh">${icon("retry")}</button>${railToggle}`;
    if (!changed.length) {
      bar = `<div class="stage-title"><small>Working tree</small></div>`;
      stage = `<div class="empty"><div><b>Nothing to commit</b>${w.clean ? "The working tree is clean." : `${proj.branch} is 1 commit ahead of origin. Push when you're ready.`}</div></div>`;
      rail = `<div class="empty" style="height:auto;padding:28px 12px">No changed files</div>`;
    } else {
      const p = w.change || changed[0];
      const d = DIFFS[p];
      bar = `<div class="stage-title"><b>${base(p)}</b><small>${dirOf(p)}</small></div><span class="grow"></span><span class="delta-inline">${delta(d)}</span>
        <button class="icon-btn" data-copy-path="${p}" title="Copy path" aria-label="Copy path">${icon("copy")}</button><button class="icon-btn" title="Open in your editor" aria-label="Open in your editor">${icon("pop")}</button>`;
      stage = diffHTML(p);

        `<button class="rrow" data-change="${x}" aria-current="${x === p}" title="${x}">${icon(DIFFS[x].isNew ? "file-plus" : "pencil")}<span class="t">${base(x)}</span><span class="end">${delta(DIFFS[x])}</span><span class="sub">${DIFFS[x].isNew ? "New file" : "Edited"}</span></button>`).join("")).join("");
    }
  } else if (w.pane === "terminal") {
    head = `<b class="grow">Terminals</b><button class="icon-btn" title="New terminal" aria-label="New terminal">${icon("plus")}</button>${railToggle}`;
    const t = w.terms.find((x) => x.id === w.term);
    if (!t) {
      bar = `<div class="stage-title"><b>No terminals</b></div>`;

    } else {
      bar = `<div class="stage-title"><b>${t.title}</b><small>~/${proj.id === "rama" ? "rama" : "demo-project"}</small></div><span class="grow"></span>
        <button class="mini">Clear</button><button class="mini" ${t.status === "run" ? "" : "disabled style='opacity:.4;cursor:default'"}>Stop</button>`;
      stage = `<div class="term">${t.out}</div>`;
    }
    rail = w.terms.map((x, i) => `<button class="rrow" data-term="${x.id}" aria-current="${x.id === w.term}" title="${x.title}"><span class="sdot ${x.status}"></span><span class="t">${x.title}</span><span class="end">⌘${i + 1}</span><span class="sub">${x.sub}</span></button>`).join("");
  } else if (w.pane === "web") {
    const pg = w.pages.find((x) => x.id === w.page);
    head = `<b class="grow">Pages</b>${railToggle}`;
    bar = `<button class="icon-btn" title="Back" aria-label="Back">${icon("left")}</button><button class="icon-btn" title="Forward" aria-label="Forward">${icon("right")}</button><button class="icon-btn" title="Reload" aria-label="Reload">${icon("retry")}</button>
      <div class="urlbar">${icon("globe")}<span>${pg.url}</span></div><button class="icon-btn" title="Open in your browser" aria-label="Open in your browser">${icon("pop")}</button>`;
    stage = pg.kind === "rama"

      : `<div class="page vids"><div class="bar"></div><div class="grid">${"<i></i>".repeat(9)}</div></div>`;
    rail = w.pages.map((x) => `<button class="rrow" data-page="${x.id}" aria-current="${x.id === w.page}" title="${x.url}">${icon("globe")}<span class="t">${x.title}</span><span class="end"></span><span class="sub">${x.url}, ${x.sub.toLowerCase()}</span></button>`).join("");
  } else {
    head = `<b class="grow">Files</b><button class="icon-btn" title="Refresh" aria-label="Refresh">${icon("retry")}</button>${railToggle}`;
    bar = `<div class="ftabs" role="tablist">${w.tabs.map((p) => `<button class="ftab ${p === w.preview ? "preview" : ""}" role="tab" data-file="${p}" data-single aria-selected="${p === w.tab}" title="${p}">${base(p)}<span class="x" data-close="${p}" title="Close" aria-label="Close ${base(p)}">${icon("x")}</span></button>`).join("")}</div><span class="grow"></span>
      ${w.tab ? `<button class="icon-btn" data-copy-path="${w.tab}" title="Copy path" aria-label="Copy path">${icon("copy")}</button><button class="icon-btn" title="Open in your editor" aria-label="Open in your editor">${icon("pop")}</button>` : ""}`;
    stage = w.tab ? codeHTML(w.tab) : `<div class="empty"><div><b>No file open</b>Pick a file from the list.</div></div>`;

    rail = w.tree.map((n) => n.f ? leaf(n.f, 26) :

      (w.open.has(n.d) ? n.kids.map((k) => leaf(k, 44)).join("") : "")).join("") +
      w.tabs.map((p) => `<button class="rrow only-collapsed" data-file="${p}" aria-current="${p === w.tab}" title="${p}">${icon("doc")}<span class="t">${base(p)}</span></button>`).join("");
  }
  $("#stageBar").innerHTML = bar;
  $("#railHead").innerHTML = head;
  $("#stage").innerHTML = stage;
  $("#rail").innerHTML = rail;
}
function openFile(path, pin) {
  const w = WS[state.project];
  if (!SRC[path]) return;
  if (!w.tabs.includes(path)) {
    if (!pin && w.preview && w.tabs.includes(w.preview)) w.tabs[w.tabs.indexOf(w.preview)] = path;
    else w.tabs.push(path);
    w.preview = pin ? null : path;
  } else if (pin && w.preview === path) w.preview = null;
  w.tab = path;
  const dir = w.tree.find((n) => n.kids?.includes(path));
  if (dir) w.open.add(dir.d);
}
function setWsOpen(open) {
  $("#codeBody").dataset.ws = open ? "open" : "closed";
  $("#wsToggle").setAttribute("aria-pressed", String(open));
  $("#wsToggle").title = open ? "Hide workspace" : "Show workspace";
}
function goto(spec) {
  const [pane, arg] = spec.split(/:(.*)/s);
  const w = WS[state.project];
  w.pane = pane;
  if (pane === "changes" && arg) w.change = arg;
  if (pane === "terminal" && arg) w.term = arg;
  if (pane === "web" && arg) w.page = arg;
  if (pane === "files" && arg) openFile(arg, true);
  setWsOpen(true);
  renderWS();
}

/* ═══ Sending (mockup: no model, so a canned reply after a short wait) ═══ */
function send(where, text) {
  if (where === "landing" || where === "chat") return sendHome(where, text);
  let chat;
  if (where === "codeLanding") {
    newCount += 1;
    chat = { id: "cnew-" + newCount, project: state.project, model: state.model, mode: state.mode, worktree: state.draftWorktree, ctx: [2, 200],
      title: text.length > 44 ? text.slice(0, 42).trimEnd() + "…" : text, snippet: "Mockup reply", when: "Just now", turns: [] };
    CODE_CHATS.unshift(chat);
    openCodeChat(chat.id);
  } else {
    chat = codeChat();
    chat.model = state.model;
  }
  chat.turns.push({ role: "user", text });
  const pending = { role: "ai", pending: "Diving in", blocks: [] };
  chat.turns.push(pending);
  renderCodeTranscript("bottom");
  setTimeout(() => { pending.pending = "Surfacing"; if (state.codeActive === chat.id) renderCodeTranscript("bottom"); }, 900);
  setTimeout(() => {
    delete pending.pending;
    pending.model = state.model;
    pending.blocks = [{ k: "prose", html: `<p>This mockup has no model behind it, so the run stops here. In Rama, ${esc(MODELS[state.model].name)} would start working in ${esc(codeProject().name)} now, and every file it reads, edit it makes and command it runs would show up here as a row you can open.</p>` }];
    if (state.codeActive === chat.id) renderCodeTranscript("bottom");
  }, 1900);
}
function sendHome(where, text) {
  let chat;
  if (where === "landing") {
    newCount += 1;
    chat = { id: "new-" + newCount, group: "Today", when: "Just now", model: state.model, title: text.length > 44 ? text.slice(0, 42).trimEnd() + "…" : text, snippet: "", turns: [] };
    CHATS.unshift(chat);
    state.activeId = chat.id;
    show("chat");
    renderComposers();
  } else {
    chat = CHATS.find((c) => c.id === state.activeId);
    chat.model = state.model;
  }
  chat.turns.push({ role: "user", text });
  const pending = { role: "ai", pending: "Diving in" };
  chat.turns.push(pending);
  renderTranscript("bottom");
  setTimeout(() => { pending.pending = "Surfacing"; if (state.activeId === chat.id) renderTranscript("bottom"); }, 900);
  setTimeout(() => {
    delete pending.pending;
    pending.model = state.model;
    pending.html = `<p>This mockup has no model behind it, so the reply stops here. In Rama, ${esc(MODELS[state.model].name)} would answer in this spot, in the same type as the rest of the conversation.</p>`;
    chat.snippet = "Mockup reply";
    if (state.activeId === chat.id) renderTranscript("bottom");
  }, 1900);
}
function answerPermission(choice) {
  const chat = CODE_CHATS.find((c) => c.id === "flash");
  const turn = chat.turns[chat.turns.length - 1];
  chat.flag = null;
  chat.snippet = choice === "deny" ? "Commit skipped." : "Committed as 4c1e9a2.";
  if (choice === "deny") {
    turn.blocks = [{ k: "prose", html: "<p>Okay, nothing's committed. The changes are still in your working tree whenever you're ready.</p>" }];
    renderCodeTranscript("bottom");
    renderSidebar();
    return;
  }
  turn.pending = "Committing";
  renderCodeTranscript("bottom");
  renderSidebar();
  setTimeout(() => {
    delete turn.pending;
    turn.blocks = [{ k: "commit" }, { k: "prose", html: `<p>Committed as <code>4c1e9a2</code>. It only exists on this Mac for now. Say the word and I'll push it to GitHub.</p>` }];
    WS.rama.committed = true;
    if (state.codeActive === chat.id) renderCodeTranscript("bottom");
    renderWS();
  }, 1100);
}

function placeAbove(pop, btn) {

  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.max(12, Math.min(r.right - w, window.innerWidth - w - 12));
  const top = r.top - h - 8 > 8 ? r.top - h - 8 : r.bottom + 8;
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

/* ═══ Events ═══ */
document.addEventListener("click", (e) => {
  const t = e.target;
  const on = (sel) => t.closest(sel);
  let el;

  if ((el = on("[data-chat]"))) return openChat(el.dataset.chat);
  if ((el = on("[data-cchat]"))) return openCodeChat(el.dataset.cchat);
  if ((el = on("[data-newin]"))) return goCodeLanding(el.dataset.newin);
  if (on('[data-action="new"]')) return state.section === "code" ? goCodeLanding() : goLanding();

  if ((el = on("[data-theme]"))) return applyTheme(el.dataset.theme);
  if (on("#seal")) {
    const p = $("#themePop");
    const open = p.hidden;
    closePops();
    p.hidden = !open;
    $("#seal").setAttribute("aria-expanded", String(open));
    return;
  }
  if ((el = on("[data-model]"))) { const was = !$("#modelPop").hidden; closePops(); if (!was) openModelMenu(el); return; }
  if ((el = on("[data-mode-menu]"))) { const was = !$("#modePop").hidden; closePops(); if (!was) openModeMenu(el); return; }
  if ((el = on("[data-pick]"))) {
    state.model = el.dataset.pick;
    const chat = state.section === "code" ? codeChat() : CHATS.find((c) => c.id === state.activeId);
    if (chat && (state.view === "chat" || state.view === "codeChat")) chat.model = state.model;
    closePops(); renderComposers(); return;
  }
  if ((el = on("[data-set-mode]"))) {
    const chat = codeChat();
    if (chat) chat.mode = el.dataset.setMode; else state.mode = el.dataset.setMode;
    closePops(); renderComposers(); return;
  }
  if (on("[data-web]")) { state.webSearch = !state.webSearch; document.querySelectorAll("[data-web]").forEach((b) => b.setAttribute("aria-pressed", String(state.webSearch))); return; }
  if (on("[data-worktree]")) {
    const chat = state.view === "codeChat" ? codeChat() : null;
    if (chat) chat.worktree = !chat.worktree; else state.draftWorktree = !state.draftWorktree;
    renderComposers(); return;
  }
  if ((el = on("[data-allow]"))) return answerPermission(el.dataset.allow);

  if ((el = on("[data-act]"))) {
    const open = el.getAttribute("aria-expanded") !== "true";
    el.setAttribute("aria-expanded", String(open));
    el.nextElementSibling.hidden = !open;
    return;
  }
  if ((el = on("[data-goto]"))) return goto(el.dataset.goto);
  if ((el = on("[data-open]"))) return goto("files:" + el.dataset.open);

  // Workspace
  if ((el = on("[data-pane]"))) { WS[state.project].pane = el.dataset.pane; return renderWS(); }
  if (on("[data-rail-toggle]")) { const ws = $("#ws"); ws.dataset.rail = ws.dataset.rail === "collapsed" ? "open" : "collapsed"; return renderWS(); }
  if ((el = on("[data-change]"))) { WS[state.project].change = el.dataset.change; return renderWS(); }
  if ((el = on("[data-term]"))) { WS[state.project].term = el.dataset.term; return renderWS(); }
  if ((el = on("[data-page]"))) { WS[state.project].page = el.dataset.page; return renderWS(); }
  if ((el = on("[data-close]"))) {
    const w = WS[state.project], p = el.dataset.close, i = w.tabs.indexOf(p);
    w.tabs.splice(i, 1);
    if (w.preview === p) w.preview = null;
    if (w.tab === p) w.tab = w.tabs[i] || w.tabs[i - 1] || null;
    return renderWS();
  }
  if ((el = on("[data-file]"))) { openFile(el.dataset.file, !el.hasAttribute("data-single")); return renderWS(); }
  if ((el = on("[data-dir]"))) { const w = WS[state.project], d = el.dataset.dir; w.open.has(d) ? w.open.delete(d) : w.open.add(d); return renderWS(); }
  if (on("#wsToggle")) return setWsOpen($("#codeBody").dataset.ws !== "open");

  if ((el = on("[data-copy], [data-copy-path]"))) {
    const text = el.dataset.copyPath || (el.closest(".card")?.querySelector(".draft-body, pre") || el.closest(".turn-ai")?.querySelector(".prose"))?.innerText.trim() || "";
    try { navigator.clipboard?.writeText(text); } catch {}
    const lbl = el.querySelector("span");
    if (lbl) { lbl.textContent = "Copied"; setTimeout(() => (lbl.textContent = "Copy"), 1400); }
    else { el.innerHTML = icon("check"); setTimeout(() => (el.innerHTML = icon("copy")), 1400); }
    return;
  }
  if ((el = on("#sizeSeg button"))) return applyScale(el.dataset.v);
  if ((el = on("#fontSeg button"))) return applyReading(el.dataset.v);

  if (on("#segHome")) return state.activeId ? openChat(state.activeId) : goLanding();
  if (on("#segCode")) return state.codeActive ? openCodeChat(state.codeActive) : goCodeLanding();
  if (on("#closeSb") || on("#scrim")) return setSb(false);
  if (on("#openSb")) return setSb(true);

  if (!on(".pop")) closePops();
});
// Double-clicking a file in the tree pins its preview tab, like the Files pane spec says.
document.addEventListener("dblclick", (e) => {
  const el = e.target.closest("[data-file]");
  if (el) { openFile(el.dataset.file, true); renderWS(); }
});

document.addEventListener("input", (e) => { if (e.target.matches(".composer textarea")) autosize(e.target); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches?.(".composer textarea") && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    e.target.form.requestSubmit();
  }
  if (e.key === "Escape") closePops();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") { e.preventDefault(); state.section === "code" ? goCodeLanding() : goLanding(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target;
  const ta = $("textarea", form);
  const text = ta.value.trim();
  if (!text) return;
  ta.value = "";
  autosize(ta);
  send(form.dataset.where, text);
});

// Dragging the splitter resizes the workspace; the chat keeps at least 380px.
const splitter = $("#splitter");
splitter.addEventListener("pointerdown", (e) => {
  const body = $("#codeBody");
  const r = body.getBoundingClientRect();
  splitter.setPointerCapture(e.pointerId);
  splitter.classList.add("drag");
  const move = (ev) => body.style.setProperty("--ws-w", Math.min(Math.max(r.right - ev.clientX - 12, 360), r.width - 380) + "px");
  const up = () => { splitter.classList.remove("drag"); splitter.removeEventListener("pointermove", move); splitter.removeEventListener("pointerup", up); };
  splitter.addEventListener("pointermove", move);
  splitter.addEventListener("pointerup", up);
});

/* ═══ Boot ═══ */
applyTheme(state.theme);
applyScale(state.scale);
applyReading(state.reading);
if (isNarrow()) setSb(false);
if (window.matchMedia("(max-width: 1100px)").matches) setWsOpen(false);
if (location.hash === "#code") openCodeChat("flash"); else goLanding();
document.fonts?.ready.then(resizeAll);
window.addEventListener("resize", resizeAll);
</script>
</body>
</html>
